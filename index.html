<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Baseline CSP for the SPA itself. %VITE_API_BASE_URL% is substituted by
      Vite at build time (see VITE_API_BASE_URL in .env); http://localhost:3000
      stays allowlisted as the local-dev fallback the api client itself falls
      back to. This can't cover header-only protections — HSTS, X-Frame-Options
      / frame-ancestors, X-Content-Type-Options — those need to be set at the
      hosting/CDN layer, which this repo doesn't control.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://drive.google.com https://*.googleusercontent.com; connect-src 'self' %VITE_API_BASE_URL% http://localhost:3000; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>KokTable Admin</title>
    <meta name="title" content="KokTable Admin" />
    <meta
      name="description"
      content="Admin portal for managing KokTable orders and content."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KokTable Admin" />
    <meta
      property="og:description"
      content="Admin portal for managing KokTable orders and content."
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="KokTable Admin" />
    <meta
      property="twitter:description"
      content="Admin portal for managing KokTable orders and content."
    />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#fff" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
