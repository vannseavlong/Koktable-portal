allowBuilds:
  '@clerk/shared': false
  esbuild: true
  protobufjs: true
  re2: true

# Transitive-only vulnerable versions pulled in by
# @trivago/prettier-plugin-sort-imports@6.0.2 (its own minimatch dep hasn't
# been bumped upstream yet); pinned to the ranges pnpm audit flags so eslint's
# separate, already-patched minimatch@10 resolution is untouched.
overrides:
  minimatch@9: ^9.0.9
  brace-expansion@2: ^2.1.4
  brace-expansion@5: ^5.0.9
  picomatch@2: ^2.3.2
  lodash-es@4: ^4.17.24
